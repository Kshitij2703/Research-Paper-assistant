<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Research Paper Assistant - AI Powered Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #16161a;
    --surface-hover: #1e1e24;
    --border: #2a2a30;
    --accent: #7c6af7;
    --accent2: #5eead4;
    --text: #e2e2e8;
    --muted: #6b6b7b;
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
    color: var(--text); 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; 
    display: flex; 
    flex-direction: column;
  }

  header {
    padding: 24px 32px;
    background: rgba(22, 22, 26, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }
  header .logo { 
    font-size: 26px; 
    font-weight: 800; 
    letter-spacing: -1px;
    background: linear-gradient(135deg, #7c6af7 0%, #5eead4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(124, 106, 247, 0.3);
  }
  header .badge {
    margin-left: auto; 
    font-size: 12px; 
    padding: 8px 16px;
    border-radius: 24px; 
    background: var(--surface);
    border: 1px solid var(--border); 
    color: var(--muted);
    transition: all 0.3s ease;
    font-weight: 500;
  }
  header .badge:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(124, 106, 247, 0.2);
    transform: translateY(-1px);
  }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); 
    display: inline-block; 
    margin-right: 8px;
    transition: all 0.3s ease;
  }
  #status-dot.ready { 
    background: var(--success); 
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }

  main { display: flex; flex: 1; overflow: hidden; }

  /* LEFT PANEL */
  .sidebar {
    width: 320px; min-width: 320px; 
    background: rgba(22, 22, 26, 0.6);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; 
    padding: 28px 20px; gap: 24px;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .upload-zone {
    border: 2px dashed var(--border); 
    border-radius: var(--radius);
    padding: 36px 24px; 
    text-align: center; 
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    background: linear-gradient(135deg, rgba(124, 106, 247, 0.08) 0%, rgba(94, 234, 212, 0.08) 100%);
    overflow: hidden;
  }
  .upload-zone::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(124, 106, 247, 0.1) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .upload-zone:hover::before, .upload-zone.drag::before {
    opacity: 1;
    animation: rotate 8s linear infinite;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .upload-zone:hover, .upload-zone.drag { 
    border-color: var(--accent); 
    background: linear-gradient(135deg, rgba(124, 106, 247, 0.15) 0%, rgba(94, 234, 212, 0.15) 100%);
    box-shadow: 0 8px 32px rgba(124, 106, 247, 0.2);
    transform: translateY(-4px) scale(1.02);
  }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 10; }
  .upload-zone .icon { 
    font-size: 48px; 
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  .upload-zone p { 
    font-size: 14px; 
    color: var(--muted); 
    line-height: 1.6;
    font-weight: 500;
  }
  .upload-zone .filename { 
    font-size: 13px; 
    color: var(--accent2); 
    margin-top: 12px; 
    font-weight: 600; 
    text-shadow: 0 0 20px rgba(94, 234, 212, 0.4);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .upload-btn {
    width: 100%; padding: 12px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.3s; display: none;
    box-shadow: 0 4px 12px var(--accent-glow);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .upload-btn:hover { 
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .paper-info {
    background: var(--surface); border-radius: var(--radius);
    padding: 12px; font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); display: none;
  }
  .paper-info .pi-label { color: var(--accent2); font-weight: 600; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .paper-info .pi-val { color: var(--text); line-height: 1.5; }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); padding: 0 4px; }

  .feature-list { display: flex; flex-direction: column; gap: 4px; }
  .feat-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; 
    border-radius: 12px; 
    border: 1px solid transparent;
    background: var(--surface); 
    color: var(--text); 
    font-size: 14px;
    font-weight: 500;
    cursor: pointer; 
    text-align: left; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .feat-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 4px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
    transform: scaleY(0);
    transition: transform 0.3s ease;
  }
  .feat-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124, 106, 247, 0.1) 0%, rgba(94, 234, 212, 0.1) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .feat-btn:hover:not(:disabled) { 
    background: var(--surface-hover); 
    border-color: var(--border);
    transform: translateX(6px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
  .feat-btn:hover:not(:disabled)::before {
    transform: scaleY(1);
  }
  .feat-btn:hover:not(:disabled)::after {
    opacity: 1;
  }
  .feat-btn.active { 
    background: linear-gradient(135deg, rgba(124, 106, 247, 0.2) 0%, rgba(94, 234, 212, 0.2) 100%);
    border-color: var(--accent);
    color: var(--accent2); 
    box-shadow: 0 8px 32px rgba(124, 106, 247, 0.3);
    transform: translateX(6px);
  }
  .feat-btn.active::before {
    transform: scaleY(1);
  }
  .feat-btn.active::after {
    opacity: 1;
  }
  .feat-btn .feat-icon { 
    font-size: 20px; 
    width: 28px; 
    text-align: center;
    transition: transform 0.3s ease;
  }
  .feat-btn:hover:not(:disabled) .feat-icon {
    transform: scale(1.2) rotate(5deg);
  }
  .feat-btn:disabled { 
    opacity: 0.4; 
    cursor: not-allowed; 
    transform: none; 
  }
  .feat-btn:disabled:hover { 
    background: var(--surface); 
    transform: none; 
    box-shadow: none; 
  }

  /* RIGHT PANEL */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .content-header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .content-header h2 { font-size: 16px; font-weight: 600; }
  .content-header .subtitle { font-size: 12px; color: var(--muted); margin-left: auto; }
  .header-btn {
    padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; color: var(--text); cursor: pointer;
    transition: background 0.2s; white-space: nowrap;
  }
  .header-btn:hover { background: var(--border); }
  .header-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .qa-bar {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: none; gap: 10px;
  }
  .qa-bar input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .qa-bar input:focus { border-color: var(--accent); }
  .qa-bar button {
    padding: 10px 18px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
  }
  .qa-bar button:hover { opacity: 0.85; }

  .output-area {
    flex: 1; overflow-y: auto; padding: 24px 28px;
  }

  .placeholder {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 12px; color: var(--muted);
  }
  .placeholder .big-icon { font-size: 48px; opacity: 0.3; }
  .placeholder p { font-size: 14px; }

  .result-card {
    background: var(--surface); 
    border: 1px solid var(--border);
    border-radius: var(--radius); 
    padding: 24px 28px;
    white-space: pre-wrap; 
    line-height: 1.8; 
    font-size: 14px;
    animation: fadeIn 0.4s ease;
    box-shadow: var(--shadow);
    position: relative;
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(10px); } 
    to { opacity: 1; transform: none; } 
  }

  .chat-log { display: flex; flex-direction: column; gap: 20px; }
  .chat-msg { display: flex; flex-direction: column; gap: 6px; animation: fadeIn 0.3s ease; }
  .chat-msg .role { 
    font-size: 11px; 
    text-transform: uppercase; 
    letter-spacing: 0.8px; 
    color: var(--muted); 
    font-weight: 600;
  }
  .chat-msg.user .bubble { 
    background: linear-gradient(135deg, rgba(124, 106, 247, 0.15) 0%, rgba(94, 234, 212, 0.15) 100%);
    border: 1px solid rgba(124, 106, 247, 0.3);
    box-shadow: 0 4px 12px rgba(124, 106, 247, 0.1);
  }
  .chat-msg.assistant .bubble { 
    background: var(--surface); 
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .bubble { 
    padding: 14px 18px; 
    border-radius: 12px; 
    font-size: 14px; 
    line-height: 1.7; 
    white-space: pre-wrap;
    transition: all 0.2s ease;
  }
  .bubble:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
  }

  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-row {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 13px; padding: 8px 0;
  }

  .progress-bar {
    width: 100%; height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden; margin: 12px 0;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s ease; animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .copy-btn {
    float: right; font-size: 11px; padding: 4px 10px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; color: var(--muted); cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  .arxiv-result {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    animation: fadeIn 0.3s ease;
  }
  .arxiv-result h3 { font-size: 14px; margin-bottom: 8px; color: var(--accent2); }
  .arxiv-result .authors { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .arxiv-result .summary { font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  .arxiv-result .actions { display: flex; gap: 8px; }
  .arxiv-result .btn-small {
    padding: 6px 12px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text); cursor: pointer; transition: all 0.2s;
  }
  .arxiv-result .btn-small:hover { background: var(--accent); border-color: var(--accent); }

  .custom-prompt-area {
    padding: 16px 28px; border-bottom: 1px solid var(--border); display: none;
  }
  .custom-prompt-area textarea {
    width: 100%; min-height: 80px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    color: var(--text); font-size: 13px; font-family: inherit;
    resize: vertical; outline: none;
  }
  .custom-prompt-area textarea:focus { border-color: var(--accent); }
  .custom-prompt-area button {
    margin-top: 8px; padding: 8px 16px; background: var(--accent);
    color: #fff; border: none; border-radius: 6px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">ResearchAI</div>
  <div class="badge"><span id="status-dot"></span><span id="status-text">No paper loaded</span></div>
</header>

<main>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".pdf" />
      <div class="icon">📄</div>
      <p>Drop PDF here or click to browse</p>
      <div class="filename" id="filename-label"></div>
    </div>
    <button class="upload-btn" id="upload-btn">Upload &amp; Process</button>

    <div class="paper-info" id="paper-info">
      <div class="pi-label">Paper loaded</div>
      <div class="pi-val" id="paper-preview"></div>
    </div>

    <div class="section-title">Features</div>
    <div class="feature-list">
      <button class="feat-btn" data-action="ask" disabled>
        <span class="feat-icon">💬</span> Ask a Question
      </button>
      <button class="feat-btn" data-action="classify" disabled>
        <span class="feat-icon">🏷️</span> Domain Classification
      </button>
      <button class="feat-btn" data-action="summarize" disabled>
        <span class="feat-icon">📝</span> Summarize
      </button>
      <button class="feat-btn" data-action="simplify" disabled>
        <span class="feat-icon">🎯</span> Simplify Abstract
      </button>
      <button class="feat-btn" data-action="insights" disabled>
        <span class="feat-icon">💡</span> Key Insights
      </button>
      <button class="feat-btn" data-action="literature_review" disabled>
        <span class="feat-icon">📚</span> Literature Review
      </button>
      <button class="feat-btn" data-action="citations" disabled>
        <span class="feat-icon">🔗</span> Extract Citations
      </button>
      <button class="feat-btn" data-action="peer_review" disabled>
        <span class="feat-icon">🔬</span> Peer Review
      </button>
      <button class="feat-btn" data-action="consistency" disabled>
        <span class="feat-icon">✅</span> Consistency Check
      </button>
      <button class="feat-btn" data-action="evaluate" disabled>
        <span class="feat-icon">📊</span> Evaluation Metrics
      </button>
    </div>

    <div class="section-title" style="margin-top: 20px;">arXiv Search</div>
    <div style="padding: 0 4px;">
      <input type="text" id="arxiv-query" placeholder="Search papers..." style="width: 100%; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; margin-bottom: 8px;" />
      <button id="arxiv-search-btn" style="width: 100%; padding: 8px; background: var(--accent2); color: var(--bg); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;">🔍 Search arXiv</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <section class="content">
    <div class="content-header">
      <h2 id="panel-title">Welcome</h2>
      <span class="subtitle" id="panel-subtitle">Upload a PDF to get started</span>
      <button class="header-btn" id="export-btn" disabled>📥 Export</button>
      <button class="header-btn" id="save-history-btn" disabled>💾 Save Chat</button>
    </div>

    <div class="qa-bar" id="qa-bar">
      <input type="text" id="question-input" placeholder="Ask anything about the paper…" />
      <button id="ask-btn">Ask</button>
    </div>

    <div class="output-area" id="output">
      <div class="placeholder">
        <div class="big-icon">🧬</div>
        <p>Upload a research paper to begin analysis</p>
      </div>
    </div>
  </section>
</main>

<script>
const API = 'http://localhost:8080';
let currentAction = null;
let chatLog = [];
let lastResult = '';
let useStreaming = true;

// --- Upload ---
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const filenameLabel = document.getElementById('filename-label');

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    filenameLabel.textContent = fileInput.files[0].name;
    uploadBtn.style.display = 'block';
  }
});

['dragover','dragenter'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('drag'); }));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('drag'); }));
dropZone.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') {
    fileInput.files = ev.dataTransfer.files;
    filenameLabel.textContent = f.name;
    uploadBtn.style.display = 'block';
  }
});

uploadBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Processing…';
  
  setOutput(`
    <div class="loading-row">
      <div class="spinner"></div> Processing PDF…
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 30%"></div></div>
  `);

  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // Enable features
    document.querySelectorAll('.feat-btn').forEach(b => b.disabled = false);
    document.getElementById('status-dot').className = 'ready';
    document.getElementById('status-text').textContent = `${data.chunks} chunks indexed`;
    document.getElementById('paper-info').style.display = 'block';
    document.getElementById('paper-preview').textContent = data.preview + '…';
    document.getElementById('export-btn').disabled = false;
    setOutput('<div class="placeholder"><div class="big-icon">✅</div><p>Paper loaded! Choose a feature from the sidebar.</p></div>');
    document.getElementById('panel-title').textContent = 'Ready';
    document.getElementById('panel-subtitle').textContent = file.name;
  } catch(e) {
    setOutput(`<div class="result-card" style="color:var(--error)">❌ ${e.message}</div>`);
  }
  uploadBtn.disabled = false;
  uploadBtn.textContent = 'Upload & Process';
});

// --- Feature buttons ---
document.querySelectorAll('.feat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.feat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const action = btn.dataset.action;
    currentAction = action;

    const titles = {
      ask: 'Ask a Question', classify: 'Domain Classification',
      summarize: 'Summarization', simplify: 'Simplify Abstract',
      insights: 'Key Insights', literature_review: 'Literature Review',
      citations: 'Citation Extraction', peer_review: 'Peer Review',
      consistency: 'Consistency Check', evaluate: 'Evaluation Metrics'
    };
    document.getElementById('panel-title').textContent = titles[action] || action;

    const qaBar = document.getElementById('qa-bar');
    qaBar.style.display = 'none';
    document.getElementById('save-history-btn').disabled = true;
    
    if (action === 'ask') {
      qaBar.style.display = 'flex';
      chatLog = [];
      setOutput('<div class="chat-log" id="chat-log"></div>');
      document.getElementById('question-input').focus();
      document.getElementById('save-history-btn').disabled = false;
    } else {
      runAction(action);
    }
  });
});

// --- Ask ---
document.getElementById('ask-btn').addEventListener('click', sendQuestion);
document.getElementById('question-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });

async function sendQuestion() {
  const input = document.getElementById('question-input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';

  appendChat('user', q);
  const loadingId = appendChat('assistant', null);

  if (useStreaming) {
    try {
      const response = await fetch(`${API}/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'ask', question: q })
      });
      
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') break;
            if (data === '[ERROR]') throw new Error('Stream error');
            try {
              const json = JSON.parse(data);
              fullText += json.token;
              updateChat(loadingId, fullText);
            } catch(e) {}
          }
        }
      }
    } catch(e) {
      updateChat(loadingId, `❌ ${e.message}`);
    }
  } else {
    try {
      const res = await fetch(`${API}/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'ask', question: q })
      });
      const data = await res.json();
      updateChat(loadingId, data.error ? `❌ ${data.error}` : data.result);
    } catch(e) {
      updateChat(loadingId, `❌ ${e.message}`);
    }
  }
}

let chatIdCounter = 0;
function appendChat(role, text) {
  const log = document.getElementById('chat-log');
  const id = 'msg-' + (++chatIdCounter);
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  div.id = id;
  div.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Assistant'}</div>
    <div class="bubble">${text === null ? '<div class="loading-row"><div class="spinner"></div> Thinking…</div>' : escHtml(text)}</div>`;
  log.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return id;
}

function updateChat(id, text) {
  const el = document.getElementById(id);
  if (el) el.querySelector('.bubble').textContent = text;
}

// --- Generic action ---
async function runAction(action) {
  setOutput(`
    <div class="loading-row">
      <div class="spinner"></div> Running analysis…
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 60%"></div></div>
  `);
  document.getElementById('panel-subtitle').textContent = 'Working…';
  try {
    const res = await fetch(`${API}/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastResult = data.result;
    setOutput(`
      <div class="result-card">
        <button class="copy-btn" onclick="copyResult(this)">Copy</button>
        ${escHtml(lastResult)}
      </div>`);
    document.getElementById('panel-subtitle').textContent = 'Done';
  } catch(e) {
    setOutput(`<div class="result-card" style="color:var(--error)">❌ ${e.message}</div>`);
    document.getElementById('panel-subtitle').textContent = 'Error';
  }
}

// --- Export ---
document.getElementById('export-btn').addEventListener('click', async () => {
  const output = document.getElementById('output');
  const resultCard = output.querySelector('.result-card');
  const chatLogEl = output.querySelector('.chat-log');
  
  let content = '';
  let filename = `research_assistant_${Date.now()}`;
  
  if (resultCard) {
    // Export single result
    content = resultCard.innerText.replace('Copy', '').trim();
  } else if (chatLogEl) {
    // Export chat conversation
    const messages = chatLogEl.querySelectorAll('.chat-msg');
    const lines = [];
    messages.forEach(msg => {
      const role = msg.querySelector('.role').textContent;
      const text = msg.querySelector('.bubble').textContent;
      lines.push(`**${role}:**\n${text}\n`);
    });
    content = lines.join('\n');
    filename = `conversation_${Date.now()}`;
  } else {
    alert('No content to export');
    return;
  }
  
  // Download as file
  const blob = new Blob([content], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename + '.md';
  a.click();
  URL.revokeObjectURL(url);
});

// --- History ---
document.getElementById('save-history-btn').addEventListener('click', async () => {
  const chatLogEl = document.getElementById('chat-log');
  if (!chatLogEl) {
    alert('No conversation to save');
    return;
  }
  
  const messages = chatLogEl.querySelectorAll('.chat-msg');
  const history = [];
  messages.forEach(msg => {
    const role = msg.querySelector('.role').textContent.toLowerCase();
    const content = msg.querySelector('.bubble').textContent;
    history.push({ role: role === 'you' ? 'user' : 'assistant', content });
  });
  
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `conversation_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

function copyResult(btn) {
  const card = btn.parentElement;
  const text = card.innerText.replace('Copy', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function setOutput(html) {
  document.getElementById('output').innerHTML = html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- arXiv Search ---
document.getElementById('arxiv-search-btn').addEventListener('click', async () => {
  const query = document.getElementById('arxiv-query').value.trim();
  if (!query) {
    alert('Please enter a search query');
    return;
  }
  
  document.getElementById('panel-title').textContent = 'arXiv Search Results';
  document.getElementById('panel-subtitle').textContent = `Searching...`;
  setOutput('<div class="loading-row"><div class="spinner"></div> Searching arXiv database...</div>');
  
  try {
    const res = await fetch(`${API}/arxiv/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, max_results: 10 })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    
    if (!data.papers || data.papers.length === 0) {
      setOutput('<div class="placeholder"><div class="big-icon">🔍</div><p>No papers found. Try different keywords.</p></div>');
      document.getElementById('panel-subtitle').textContent = 'No results';
      return;
    }
    
    let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';
    data.papers.forEach((paper, i) => {
      const authors = paper.authors.slice(0, 3).join(', ') + (paper.authors.length > 3 ? ' et al.' : '');
      const safeTitle = paper.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `
        <div class="arxiv-result">
          <h3>${escHtml(paper.title)}</h3>
          <div class="authors">${escHtml(authors)}</div>
          <div class="summary">${escHtml(paper.summary.substring(0, 300))}...</div>
          <div class="actions">
            <button class="btn-small" style="background: var(--accent); color: white; border-color: var(--accent);" onclick="loadAndAnalyze('${paper.pdf_url}', '${safeTitle}')">⚡ Load & Analyze</button>
            <button class="btn-small" onclick="downloadArxiv('${paper.pdf_url}', '${safeTitle}')">📥 Download</button>
            <a href="${paper.pdf_url}" target="_blank" class="btn-small" style="text-decoration: none;">🔗 View</a>
          </div>
        </div>
      `;
    });
    html += '</div>';
    setOutput(html);
    document.getElementById('panel-subtitle').textContent = `Found ${data.papers.length} papers`;
  } catch(e) {
    setOutput(`<div class="result-card" style="color:var(--error)">❌ Search failed: ${e.message}</div>`);
    document.getElementById('panel-subtitle').textContent = 'Error';
  }
});

document.getElementById('arxiv-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('arxiv-search-btn').click();
});

async function downloadArxiv(url, title) {
  try {
    const res = await fetch(`${API}/arxiv/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const blob = await res.blob();
    const downloadUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = title.substring(0, 50).replace(/[^a-z0-9]/gi, '_') + '.pdf';
    a.click();
    URL.revokeObjectURL(downloadUrl);
  } catch(e) {
    alert('Download failed: ' + e.message);
  }
}

async function loadAndAnalyze(url, title) {
  try {
    // Show loading state
    setOutput(`
      <div class="loading-row">
        <div class="spinner"></div> Downloading and processing paper...
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: 30%"></div></div>
    `);
    document.getElementById('panel-title').textContent = 'Loading Paper';
    document.getElementById('panel-subtitle').textContent = 'Downloading from arXiv...';
    
    // Download PDF
    const res = await fetch(`${API}/arxiv/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const blob = await res.blob();
    
    // Upload to system
    document.getElementById('panel-subtitle').textContent = 'Processing PDF...';
    const fd = new FormData();
    fd.append('file', blob, 'arxiv_paper.pdf');
    
    const uploadRes = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await uploadRes.json();
    if (data.error) throw new Error(data.error);

    // Enable features
    document.querySelectorAll('.feat-btn').forEach(b => b.disabled = false);
    document.getElementById('status-dot').className = 'ready';
    document.getElementById('status-text').textContent = `${data.chunks} chunks indexed`;
    document.getElementById('paper-info').style.display = 'block';
    document.getElementById('paper-preview').textContent = data.preview + '…';
    document.getElementById('export-btn').disabled = false;
    
    setOutput('<div class="placeholder"><div class="big-icon">✅</div><p>Paper loaded! Choose a feature from the sidebar.</p></div>');
    document.getElementById('panel-title').textContent = 'Ready';
    document.getElementById('panel-subtitle').textContent = title.substring(0, 60);
  } catch(e) {
    setOutput(`<div class="result-card" style="color:var(--error)">❌ ${e.message}</div>`);
    document.getElementById('panel-subtitle').textContent = 'Error';
  }
}
</script>
